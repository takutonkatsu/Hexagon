<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ヘキサゴンのフレンド追加ページです。">
  <title>フレンド追加 | ヘキサゴン</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --panel: #111620;
      --line: rgba(255, 255, 255, .16);
      --text: #f6f8fb;
      --muted: #aeb7c6;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 211, 238, .16), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.7;
    }
    main {
      width: min(560px, 100%);
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(17, 22, 32, .94);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32);
    }
    .icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 12px;
      border-radius: 22px;
      border: 2px solid rgba(34, 211, 238, .58);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 950;
    }
    p { margin: 10px 0; color: var(--muted); font-weight: 700; }
    .code {
      margin: 18px auto;
      padding: 12px 16px;
      width: fit-content;
      min-width: 180px;
      border: 1px solid rgba(34, 211, 238, .45);
      border-radius: 14px;
      background: rgba(0, 0, 0, .28);
      color: var(--cyan);
      font-size: 26px;
      font-weight: 950;
      letter-spacing: .12em;
    }
    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    a.button {
      display: block;
      padding: 13px 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, #2bf4ff, #0aa4df);
      color: #041018;
      text-decoration: none;
      font-weight: 950;
    }
    .qr {
      width: 132px;
      margin: 18px auto 6px;
      padding: 8px;
      border-radius: 14px;
      background: #fff;
    }
    .small { font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./assets/images/Hexagon_icon.png" alt="ヘキサゴン">
    <h1>フレンド追加</h1>
    <p>ヘキサゴンを開いて、下のフレンドコードを入力してください。</p>
    <div class="code" id="friend-code">--------</div>
    <div class="actions">
      <a class="button" href="https://apps.apple.com/jp/app/id6746375328">App Store で入手</a>
      <a class="button" href="./">公式サイトへ</a>
    </div>
    <img class="qr" src="./assets/images/QRcode_Hexagon_iOS.png" alt="App Store QRコード">
    <p class="small">コードの有効期限が切れている場合は、フレンドにもう一度リンクを作成してもらってください。</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get('code') || '').trim().toUpperCase();
    if (code) {
      document.getElementById('friend-code').textContent = code;
    }
  </script>
</body>
</html>
